  <style>
:root { --bg: #F9F9F8; --ink: #20211F; --black: #111210; --muted: #676762; --serif: "Instrument Serif", Georgia, serif; --sans: "Inter", "Helvetica Neue", Arial, sans-serif; --pad: 24px; }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
a { color: inherit; text-decoration: none; }
img { display: block; max-width: 100%; }

.haze { position: absolute; pointer-events: none; }
.haze.rose { left: -5%; top: -170px; width: 64%; height: 360px; background: radial-gradient(50% 55% at 50% 45%, rgba(247, 157, 203, 1) 0%, rgba(249, 187, 227, .69) 45%, rgba(249, 249, 248, 0) 100%); }
.haze.apricot { left: 24%; top: -180px; width: 67%; height: 380px; background: radial-gradient(50% 58% at 50% 42%, rgba(255, 150, 126, 1) 0%, rgba(255, 217, 175, .59) 50%, rgba(249, 249, 248, 0) 100%); }
.nav { position: relative; display: flex; align-items: center; justify-content: space-between; height: 64px; padding: 0 var(--pad); }
.action { display: inline-flex; align-items: center; gap: 12px; height: 46px; padding: 6px 6px 6px 18px; border-radius: 100px; background: var(--black); color: #fff; font-size: 13px; white-space: nowrap; transition: background .2s ease; }
.action .badge { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: #30312F; transition: transform .25s cubic-bezier(.2,.7,.2,1); }
.action:hover { background: #000; }
.action:hover .badge { transform: rotate(45deg); }
.action svg { width: 18px; height: 18px; }
.nav .action { height: 38px; font-size: 12px; padding-left: 17px; }
.ghost { display: inline-flex; align-items: center; height: 46px; padding: 0 20px; border-radius: 100px; border: 1px solid rgba(32, 33, 31, .18); background: rgba(255,255,255,.5); font-size: 13px; transition: background .2s ease; }
.ghost:hover { background: #fff; }
main { position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px var(--pad) 72px; text-align: center; }
.code { margin: 0 0 6px; font-family: var(--serif); font-style: italic; font-size: clamp(22px, 2vw, 28px); color: var(--muted); }
h1 { margin: 0; font-family: var(--serif); font-weight: 400; font-size: clamp(44px, 6vw, 84px); line-height: 1; letter-spacing: -0.02em; }
.lede { margin: 18px 0 30px; font-size: 17px; line-height: 1.5; color: var(--muted); }
.buttons { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
/* three small tilted frames, like the projects on the home page; hover straightens one */
.peek { list-style: none; display: flex; justify-content: center; margin: 56px 0 0; padding: 0; }
.peek li { margin: 0 -14px; }
.peek a { display: block; width: 168px; padding: 8px 8px 12px; border-radius: 16px; background: #fff; box-shadow: 0 1px 2px rgba(22,26,44,.05), 0 20px 40px -26px rgba(22,26,44,.45); transform: translateY(var(--ty)) rotate(var(--r)); transition: transform .45s cubic-bezier(.2,1.2,.35,1); }
.peek a:hover { transform: translateY(calc(var(--ty) - 6px)) rotate(0deg) scale(1.04); position: relative; z-index: 2; }
.peek img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 9px; }
.peek span { display: block; margin-top: 8px; font-size: 12px; text-align: left; }
.peek li:nth-child(1) a { --r: -6deg; --ty: 8px; }
.peek li:nth-child(2) a { --r: 2deg; --ty: -6px; }
.peek li:nth-child(3) a { --r: 7deg; --ty: 10px; }
@media (max-width: 640px) { .peek { display: none; } .nav .action .label-text { display: none; } }
